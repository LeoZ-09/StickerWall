<!doctype html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>便签墙 · StickerWall</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<!-- ==================== WALL ==================== -->
<div class="wall" id="wall">
  <div id="stickers-container">
    <svg class="connections-layer" id="connectionsLayer"></svg>
  </div>
</div>

<!-- ==================== BOTTOM BAR (AI Chat + Settings) ==================== -->
<div class="bottom-bar" id="bottomBar">
  <div class="ai-chat-wrap hidden" id="aiChatWrap">
    <input type="text" class="ai-chat-input" id="aiChatInput" placeholder="输入想要的便签主题，让 AI 帮你整理…" onkeydown="if(event.key==='Enter')sendAIChat()">
    <button class="ai-chat-send" id="aiChatSend" onclick="sendAIChat()" title="发送">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"></line>
        <polyline points="5 12 12 5 19 12"></polyline>
      </svg>
    </button>
  </div>
  <button class="settings-btn" id="settingsBtn" onclick="openSettings()" title="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
  </button>
</div>

<!-- ==================== SETTINGS OVERLAY ==================== -->
<div class="settings-overlay" id="settingsOverlay" style="display:none" onclick="if(event.target===this)closeSettings()">
  <div class="settings-modal" onclick="event.stopPropagation()">
    <div class="settings-header">
      <h3>设置</h3>
      <button class="settings-confirm" onclick="saveSettings()" title="保存设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
    </div>
    <div class="settings-body">
      <div class="settings-group">
        <label>默认署名</label>
        <input type="text" id="setAuthor" placeholder="新建便签时的默认署名" maxlength="30">
      </div>
      <div class="settings-group">
        <div class="settings-row">
          <span>AI 功能</span>
          <div class="switch-wrap">
            <input type="checkbox" class="switch-input" id="setAIEnabled" onchange="onSettingAIEnabled()">
            <label class="switch-label" for="setAIEnabled"></label>
          </div>
        </div>
      </div>
      <div class="ai-settings-wrap">
        <div class="settings-group">
          <label>服务平台</label>
          <select id="setPlatform" onchange="onSettingPlatformChange()">
            <option value="openai">OpenAI</option>
            <option value="custom">自定义 / 兼容接口</option>
          </select>
        </div>
        <div class="settings-group">
          <label>API Key</label>
          <input type="password" id="setApiKey" placeholder="sk-...">
        </div>
        <div class="settings-group">
          <label>接口地址 (Base URL)</label>
          <input type="text" id="setBaseUrl" placeholder="https://api.openai.com/v1">
        </div>
        <div class="settings-group">
          <label>模型</label>
          <input type="text" id="setModel" placeholder="gpt-3.5-turbo">
        </div>
      </div>
    </div>
    
  </div>
</div>

<!-- ==================== AI REPLY BUBBLE ==================== -->
<div class="ai-reply-bubble" id="aiReplyBubble" style="display:none">
  <div id="aiBubbleContent"></div>
  <div class="ai-bubble-to-sticker-wrap">
    <button class="ai-bubble-to-sticker" id="aiBubbleToStickerBtn" onclick="convertAIReplyToSticker()" title="转为便签">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </div>
</div>

<!-- ==================== DETAIL OVERLAY ==================== -->
<div class="detail-overlay" id="detailOverlay" style="display:none" onclick="if(event.target===this)closeDetail()">
  <div class="detail-card">
    <div class="detail-header">
      <div class="detail-header-meta">
        <div class="author" id="detailAuthor"></div>
        <div class="date" id="detailDate"></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
        <button class="detail-conn-btn" id="detailConnBtn" title="建立联系">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
        </button>
        <button class="detail-close detail-delete-btn" onclick="deleteFromDetail()" title="删除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
            <path d="M10 11v6"></path>
            <path d="M14 11v6"></path>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
          </svg>
        </button>
      </div>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>
</div>

<!-- ==================== CONNECTION BUBBLE ==================== -->
<div class="conn-bubble" id="connBubble" style="display:none">
  <button class="conn-bubble-delete" id="connBubbleDelete" title="删除此联系">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;">
      <polyline points="3 6 5 6 21 6"></polyline>
      <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
      <path d="M10 11v6"></path>
      <path d="M14 11v6"></path>
      <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
    </svg>
  </button>
</div>

<!-- ==================== CONNECTION PICKER MODAL ==================== -->
<div class="conn-picker-overlay" id="connPickerOverlay" style="display:none">
  <div class="conn-picker-modal">
    <div class="conn-picker-header">
      <input type="text" class="conn-picker-search" id="connPickerSearch" placeholder="搜索便签..." autocomplete="off">
      <button class="conn-picker-confirm" id="connPickerConfirm" title="确认">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </button>
    </div>
    <div class="conn-picker-list" id="connPickerList"></div>
  </div>
</div>

<!-- ==================== UNIFIED CREATE MODAL ==================== -->
<div class="create-overlay" id="createOverlay" style="display:none" onclick="if(event.target===this)closeCreateModal()">
  <div class="create-modal" onclick="event.stopPropagation()">
    <div class="create-body" id="createBody">
      <div class="create-tabs-row">
        <div class="create-tabs" id="modeToggle">
          <button class="create-tab active" data-mode="text" onclick="setCreateMode('text')" title="文字">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="6" y1="6" x2="18" y2="6"></line>
              <line x1="6" y1="12" x2="18" y2="12"></line>
              <line x1="6" y1="18" x2="13" y2="18"></line>
            </svg>
            文字
          </button>
          <button class="create-tab" data-mode="draw" onclick="setCreateMode('draw')" title="绘图">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
              <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
              <path d="M2 2l7.586 7.586"></path>
              <circle cx="11" cy="11" r="2"></circle>
            </svg>
            绘图
          </button>
          <button class="create-tab" data-mode="image" onclick="setCreateMode('image')" title="图片">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <path d="M21 15l-5-5L5 21"></path>
            </svg>
            图片
          </button>
        </div>
        <button class="create-confirm" onclick="submitCreateSticker()" title="保存便签">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
      </div>
      <div class="create-content">
        <textarea class="create-textarea" id="createTextarea" placeholder="写下你的想法…" rows="5"></textarea>
        <div class="create-canvas-panel" id="createCanvasPanel" style="display:none;">
          <div class="canvas-toolbar" id="drawToolbar">
            <button class="tool-btn active" data-tool="pen" onclick="setCVTool('pen',this)" title="画笔">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                <path d="M2 2l7.586 7.586"></path>
                <circle cx="11" cy="11" r="2"></circle>
              </svg>
            </button>
            <button class="tool-btn" data-tool="eraser" onclick="setCVTool('eraser',this)" title="橡皮">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 20H7L3 16a2 2 0 0 1 0-2.8L13.2 3a2 2 0 0 1 2.8 0l5 5a2 2 0 0 1 0 2.8L11 20"></path>
                <line x1="18" y1="13" x2="8" y2="13"></line>
              </svg>
            </button>
            <span class="tool-sep"></span>
            <button class="tool-btn" data-tool="rect" onclick="setCVTool('rect',this)" title="矩形">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2.5"></rect>
              </svg>
            </button>
            <button class="tool-btn" data-tool="circle" onclick="setCVTool('circle',this)" title="圆形">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
              </svg>
            </button>
            <span class="tool-sep"></span>
            <div class="tool-style-group">
              <button class="tool-color-dot" id="cvColorBtn" title="颜色" onclick="openColorPicker(event)" style="background:#102033"></button>
              <input type="number" id="cvSize" value="3" min="1" max="20" title="粗细">
              <div class="color-picker-popup" id="colorPickerPopup" style="display:none">
                <div class="color-picker-wheel-area" id="colorWheelWrap">
                  <div class="color-wheel" id="colorWheel"><div class="color-wheel-ring"></div><div class="color-wheel-thumb" id="hueThumb"></div></div>
                  <div class="color-wheel-center" id="sbCircle"><div class="color-wheel-sbthumb" id="sbThumb"></div></div>
                </div>
                <div class="color-preview-bar">
                  <div class="color-preview-swatch" id="colorPreview"></div>
                  <span class="color-hex" id="colorHex">#102033</span>
                </div>
              </div>
            </div>
            <button class="tool-btn" onclick="clearCVCanvas()" title="清空">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
              </svg>
            </button>
          </div>
          <div class="canvas-wrap"><canvas id="cvCanvas" width="460" height="280"></canvas></div>
        </div>
        <div class="create-image-zone" id="createImageZone">
          <div class="image-zone-empty">
            <div class="image-zone-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
            </div>
            <div class="image-zone-title">拖拽图片到此处</div>
            <div class="image-zone-hint">或者<span class="image-zone-link">点击上传</span></div>
          </div>
          <img id="createImgEl" class="image-zone-preview" alt="预览">
        </div>
      </div>
      <div class="create-meta">
        <div class="meta-row">
          
          <input type="text" class="meta-name-input" id="createName" placeholder="你的名字" maxlength="30">
        </div>
        <div class="meta-row">
          
          <div class="color-dots-inline" id="createColorDots">
            <span class="color-dot-sm active bg-1" data-color="#FFF9E6" onclick="selectCreateColor(this)"></span>
            <span class="color-dot-sm bg-2" data-color="#F0F7FF" onclick="selectCreateColor(this)"></span>
            <span class="color-dot-sm bg-3" data-color="#FFF0F5" onclick="selectCreateColor(this)"></span>
            <span class="color-dot-sm bg-4" data-color="#F5FFF5" onclick="selectCreateColor(this)"></span>
            <span class="color-dot-sm bg-5" data-color="#FFF5F0" onclick="selectCreateColor(this)"></span>
            <span class="color-dot-sm bg-6" data-color="#F8F0FF" onclick="selectCreateColor(this)"></span>
            <span class="color-dot-sm bg-7" data-color="#FFFFFF" onclick="selectCreateColor(this)"></span>
          </div>
          
        </div>
      </div>
    </div>
    <input type="file" id="createImgFile" accept="image/*" style="display:none" onchange="handleCreateImage(event)">
    
  </div>
</div>

<!-- ==================== SCRIPTS ==================== -->
<script src="/static/ai.js"></script>
<script src="/static/app.js"></script>

</body></html>
